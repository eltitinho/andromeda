<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Email</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        .settings-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
        .settings-container h2 {
            margin-bottom: 20px;
            text-align: center;
        }
        .settings-container input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .settings-container button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .settings-container button:hover {
            background-color: #0056b3;
        }
        .back-button {
            margin-top: 15px;
            background-color: #6c757d;
        }
        .back-button:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <div class="settings-container">
        <h2>Configuración de Email</h2>
        {% if success %}
        <div style="background-color: #d4edda; color: #155724; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
            Configuración guardada correctamente
        </div>
        {% endif %}
        <form method="POST" action="/private/email_settings">
            <input type="email" name="email_address" placeholder="Dirección de email" required>
            <input type="password" name="email_password" placeholder="Contraseña" required>
            <button type="submit">Guardar Configuración</button>
        </form>
        <button class="back-button" onclick="window.location.href='/'">Volver</button>
    </div>
</body>
</html>
