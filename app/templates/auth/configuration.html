<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        .config-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
            margin: 20px 0;
        }
        .config-container h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }
        .config-menu {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .config-menu button {
            background: none;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            border-bottom: 2px solid transparent;
        }
        .config-menu button.active {
            color: #007BFF;
            border-bottom: 2px solid #007BFF;
        }
        .config-section {
            display: none;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        .config-section.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button[type="submit"] {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button[type="submit"]:hover {
            background-color: #0056b3;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
        }
        .back-button {
            margin-top: 15px;
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        .back-button:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <div class="config-container">
        <h2>Configuración del Sistema</h2>
        
        <div class="config-menu">
            <button class="menu-button active" onclick="showSection('email')">Configuración de Email</button>
            <button class="menu-button" onclick="showSection('general')">General</button>
        </div>
        
        <!-- Email Configuration Section -->
        <div id="email-section" class="config-section active">
            <div class="success-message" id="email-success">
                Configuración de email guardada correctamente
            </div>
            <form id="email-form" method="POST" action="/private/email_settings">
                <div class="form-group">
                    <label for="email_address">Dirección de Email:</label>
                    <input type="email" id="email_address" name="email_address" placeholder="tu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="email_password">Contraseña:</label>
                    <input type="password" id="email_password" name="email_password" placeholder="Contraseña" required>
                </div>
                <button type="submit">Guardar Configuración de Email</button>
            </form>
        </div>
        
        <!-- General Configuration Section -->
        <div id="general-section" class="config-section">
            <p>Configuración general del sistema (próximamente).</p>
        </div>
        
        <button class="back-button" onclick="window.location.href='/'">Volver al Inicio</button>
    </div>
    
    <script>
        function showSection(section) {
            // Hide all sections
            document.querySelectorAll('.config-section').forEach(function(section) {
                section.classList.remove('active');
            });
            
            // Remove active class from all menu buttons
            document.querySelectorAll('.menu-button').forEach(function(button) {
                button.classList.remove('active');
            });
            
            // Show selected section
            document.getElementById(section + '-section').classList.add('active');
            
            // Add active class to clicked button
            event.target.classList.add('active');
        }
        
        // Handle form submission - let it submit normally to server
        // Success message will be shown by the server response
    </script>
</body>
</html>
